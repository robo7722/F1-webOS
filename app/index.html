<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>F1 Hub</title>
<style>
/* 10-Fuß-Design: Menüleiste links, Kartenreihen rechts, Detailfläche oben, Tastenhilfe unten.
   Konservatives CSS (kein grid, kein flex-gap, kein inset) – läuft ab Chromium 53 (webOS 4). */
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#08080c}
body{color:#f4f4f7;font:26px/1.35 "LG Smart UI","Museo Sans",Roboto,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}
#app{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;-webkit-transform-origin:0 0;transform-origin:0 0;background:#0b0b10}
.mut{color:#a5a5b8}
.tag{display:inline-block;font-size:18px;font-weight:800;padding:3px 10px;border-radius:7px;color:#fff;background:#e10600;vertical-align:middle}
.tag.F2{background:#2d7dff}
.flag{display:inline-block;width:60px;height:40px;border-radius:6px;background:#333;object-fit:cover;vertical-align:middle;-webkit-flex:none;flex:none}
.map{-webkit-flex:none;flex:none}
.map path{fill:none;stroke:#f4f4f7;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}

/* Menüleiste */
#rail{position:absolute;left:0;top:0;bottom:0;width:380px;background:#050508;border-right:1px solid #1d1d27;padding:48px 28px 40px 72px}
#logo{height:50px;display:block;margin:0 0 70px 14px}
.ni{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;height:84px;padding:0 22px;margin-bottom:10px;border-radius:18px;font-size:30px;font-weight:700;color:#c9c9d6;position:relative;cursor:pointer;-webkit-transition:background .12s,color .12s;transition:background .12s,color .12s}
.ni svg{width:38px;height:38px;margin-right:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;-webkit-flex:none;flex:none}
.ni.act{color:#fff}
.ni.act:before{content:"";position:absolute;left:-14px;top:20px;bottom:20px;width:6px;border-radius:3px;background:#e10600}
.ni.foc{background:#fff;color:#0b0b10}
#nb{position:absolute;left:72px;right:28px;bottom:40px}
#st{font-size:16px;line-height:1.45;color:#7d7d90;padding:8px 22px 0}

/* Kopfzeile */
#hdr{position:absolute;left:420px;right:80px;top:48px;height:70px;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center}
#ptitle{-webkit-flex:1;flex:1;margin:0;font-size:46px;font-weight:900;font-style:italic;text-transform:uppercase;letter-spacing:1px}
#nxchip{margin-right:36px;font-size:22px;color:#c9c9d6;background:#16161e;border-radius:40px;padding:10px 22px;white-space:nowrap}
#nxchip b{color:#fff}
#clock{text-align:right;line-height:1.05}
#clock b{display:block;font-size:46px;font-variant-numeric:tabular-nums}
#clock span{font-size:20px;color:#a5a5b8}

/* Seiten */
.page{position:absolute;left:420px;right:0;top:140px;bottom:84px;display:none}
.page.show{display:block}
.vp{position:absolute;left:-20px;right:0;top:0;bottom:0;overflow:hidden}
.sc{position:relative;-webkit-transition:-webkit-transform .28s ease;transition:transform .28s ease}
.det{position:absolute;left:0;right:80px;top:0;height:380px;background:#14141c;border-radius:26px;overflow:hidden}
.page.hd .vp{top:404px}

/* Kartenreihen */
.shelf{padding:0 0 18px}
.shelf h3{margin:0 0 4px 20px;font-size:26px;font-weight:700;color:#a5a5b8;letter-spacing:.5px}
.shelf.cur h3{color:#fff}
.sv{overflow:hidden;padding:18px 20px 22px}
.line{white-space:nowrap;font-size:0;-webkit-transition:-webkit-transform .22s ease;transition:transform .22s ease}
.it{display:inline-block;vertical-align:top;white-space:normal;font-size:26px;margin-right:24px;background:#1a1a23;border-radius:20px;position:relative;overflow:hidden;cursor:pointer;-webkit-transition:-webkit-transform .14s,box-shadow .14s,background .14s;transition:transform .14s,box-shadow .14s,background .14s}
.hero.foc{-webkit-transform:scale(1.015)!important;transform:scale(1.015)!important}
.it.foc{-webkit-transform:scale(1.06);transform:scale(1.06);box-shadow:0 0 0 5px #fff,0 18px 40px rgba(0,0,0,.6);background:#262632;z-index:2}
.it .bar{position:absolute;left:0;top:0;bottom:0;width:7px;background:#e10600}
.it .bar.F2{background:#2d7dff}
.empty{font-size:26px;color:#a5a5b8;padding:20px}

/* Start */
.hero{width:1400px;height:420px;background:#1b1b24;color:#fff}
.hero .bg{position:absolute;left:-14px;top:-14px;right:-14px;bottom:-14px;background-size:cover;background-position:center;-webkit-filter:blur(5px) saturate(1.1);filter:blur(5px) saturate(1.1)}
.hero .sh{position:absolute;left:0;top:0;right:0;bottom:0;background:linear-gradient(90deg,rgba(0,0,0,.82),rgba(0,0,0,.35))}
.hero .hc{position:absolute;left:56px;top:46px;right:56px;bottom:40px;text-shadow:0 2px 10px rgba(0,0,0,.6)}
.hero small{font-size:22px;letter-spacing:3px;text-transform:uppercase;opacity:.9}
.hero .g{font-size:76px;font-weight:900;font-style:italic;text-transform:uppercase;line-height:1;margin:12px 0 10px}
.hero .n{font-size:38px;font-weight:700}
.hero .d{font-size:30px;opacity:.92;margin-top:6px}
.hero .wx{position:absolute;left:0;bottom:0;font-size:24px;line-height:1.5}
.hero .wx b{display:inline-block;min-width:120px}
.cd{position:absolute;right:0;top:20px;display:-webkit-flex;display:flex}
.cd div{width:136px;margin-left:16px;background:rgba(0,0,0,.45);border-radius:18px;text-align:center;padding:16px 0 12px}
.cd b{display:block;font-size:68px;line-height:1;font-variant-numeric:tabular-nums}
.cd span{font-size:18px;letter-spacing:2px;text-transform:uppercase;opacity:.85}
.hero .ok{position:absolute;right:0;bottom:0;font-size:22px;background:rgba(255,255,255,.14);border-radius:30px;padding:8px 20px}
.ss{width:320px;height:212px;padding:20px 22px 18px 30px}
.ss .tm{font-size:38px;font-weight:800;margin:10px 0 2px;font-variant-numeric:tabular-nums}
.ss .dy{font-size:20px;color:#a5a5b8;text-transform:uppercase;letter-spacing:1px}
.ss b{display:block;font-size:24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ss i{display:block;font-style:normal;font-size:21px;color:#c9c9d6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nc{width:440px;height:200px;padding:22px 26px}
.nc small,.nl small{display:block;font-size:19px;color:#a5a5b8;margin-bottom:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nc small .tag,.nl small .tag{font-size:15px;padding:2px 8px;margin-right:10px}
.nc h4{margin:0;font-size:26px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.rc{width:340px;height:186px;padding:20px 24px 18px 30px}
.rc small{display:block;font-size:19px;color:#a5a5b8;text-transform:uppercase;letter-spacing:1px}
.rc b{display:block;font-size:27px;font-weight:900;font-style:italic;text-transform:uppercase;line-height:1.15;margin:6px 92px 12px 0;height:62px;overflow:hidden}
.rc .map{position:absolute;right:18px;top:18px;width:84px;height:50px}
.rc i{display:block;font-style:normal;font-size:16px;color:#a5a5b8;text-transform:uppercase;letter-spacing:1px}
.rc .w{font-size:23px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Termine */
.chip{width:auto;padding:16px 34px;font-size:24px;font-weight:800;font-style:italic;text-transform:uppercase;letter-spacing:.5px;border-radius:40px;background:#1a1a23}
.chip.on{background:#e10600;color:#fff}
.chip.foc{background:#fff;color:#0b0b10}
.gc{width:330px;height:176px;padding:20px 22px 18px 30px}
.gc .h{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center}
.gc .h .flag{margin-right:14px;width:54px;height:36px}
.gc b{-webkit-flex:1;flex:1;font-size:26px;font-weight:900;font-style:italic;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gc .r{font-size:21px;color:#a5a5b8;margin-top:10px}
.gc .nx{font-size:21px;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gc.past{opacity:.55}
.yc{width:270px;height:176px;padding:20px 22px}
.yc .flag{width:54px;height:36px}
.yc .map{position:absolute;right:16px;top:16px;width:80px;height:48px}
.yc b{display:block;font-size:23px;line-height:1.2;margin-top:12px;height:56px;overflow:hidden}
.yc i{display:block;font-style:normal;color:#a5a5b8;font-size:20px}
.spr{display:inline-block;font-size:14px;font-weight:800;border:2px solid #e10600;color:#ff4b44;padding:0 7px;border-radius:5px;text-transform:uppercase;margin-left:8px;vertical-align:middle}
.dh{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;padding:24px 40px 0}
.dh .flag{width:84px;height:56px;margin-right:26px}
.dh .t{-webkit-flex:1;flex:1;min-width:0}
.dh .t b{display:block;font-size:50px;font-weight:900;font-style:italic;text-transform:uppercase;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dh .t span{font-size:24px;color:#a5a5b8}
.dh .map{width:190px;height:114px}
.dwx{padding:12px 40px 0;font-size:22px;color:#c9c9d6}
.dwx b{color:#fff}
.sl{position:absolute;left:40px;right:40px;bottom:18px;height:196px;overflow:hidden}
.sl .col{float:left;width:50%;padding-right:30px}
.srow{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;height:39px;font-size:23px}
.srow .tag{font-size:15px;padding:2px 8px;margin-right:14px;min-width:42px;text-align:center}
.srow .n{-webkit-flex:1;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.srow .t{font-variant-numeric:tabular-nums;color:#c9c9d6;white-space:nowrap;margin-left:12px}
.srow.past{opacity:.4}
.srow .v{font-size:15px;color:#a5a5b8;margin-left:6px}

/* WM */
.wc{width:320px;height:150px;padding:20px 24px 18px 30px}
.wc small{display:block;font-size:20px;font-weight:800;font-style:italic;text-transform:uppercase;letter-spacing:1px;color:#ff4b44}
.wc b{display:block;font-size:26px;margin-top:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wc i{font-style:normal;color:#a5a5b8;font-size:22px}
#w-tab{position:absolute;left:0;right:80px;top:250px;bottom:0}
#w-tab .sub{font-size:21px;color:#a5a5b8;margin:0 0 12px 4px}
.tcol{float:left;width:calc(50% - 14px);margin-right:28px;background:#14141c;border-radius:20px;overflow:hidden}
.tcol:last-child{margin-right:0}
.tr{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;height:48px;padding:0 20px;border-top:1px solid #23232e;border-left:6px solid transparent;font-size:23px}
.tr:first-child{border-top:0}
.tr .p{width:46px;font-weight:800;color:#a5a5b8}
.tr .n{-webkit-flex:1;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.tr .n em{font-style:normal;font-weight:400;color:#a5a5b8;font-size:19px;margin-left:10px}
.tr .v{font-variant-numeric:tabular-nums;font-weight:800;text-align:right;min-width:70px}
.tr .v.w{min-width:150px;font-weight:600}
.tr .v small{font-size:15px;color:#a5a5b8;font-weight:400;margin-left:4px}
.fl{color:#c77dff}

/* Ergebnisse */
.pod{position:absolute;left:40px;right:40px;bottom:30px;display:-webkit-flex;display:flex}
.pod div{-webkit-flex:1;flex:1;margin-right:20px;background:#1d1d27;border-radius:18px;padding:16px 22px;border-top:6px solid #555;min-width:0}
.pod div:last-child{margin-right:0}
.pod .p{font-size:22px;font-weight:900;color:#a5a5b8}
.pod b{display:block;font-size:28px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pod i{font-style:normal;font-size:20px;color:#a5a5b8}
.dx{padding:10px 40px 0;font-size:22px;color:#c9c9d6}
.dx b{color:#fff}

/* News */
#pg-n .vp{right:620px}
.nl{width:850px;height:132px;padding:20px 26px 18px 32px;margin-right:0}
.nl h4{margin:0;font-size:27px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#pg-n .shelf{padding:0}
#pg-n .it.foc{-webkit-transform:scale(1.02);transform:scale(1.02)}
#pg-n .sv{padding:9px 20px 9px}
.nd{left:auto;right:80px;width:520px;height:auto;bottom:0;padding:34px 36px}
.nd small{display:block;font-size:20px;color:#a5a5b8;margin-bottom:16px}
.nd h2{margin:0;font-size:32px;line-height:1.3;max-height:250px;overflow:hidden}
.qr{position:absolute;left:36px;right:36px;bottom:30px;text-align:center}
.qr img{width:260px;height:260px;background:#fff;padding:12px;border-radius:14px;image-rendering:pixelated}
.qr p{margin:12px 0 0;font-size:20px;color:#c9c9d6}

/* Tastenhilfe */
#hint{z-index:60;position:absolute;left:420px;right:80px;bottom:28px;height:40px;font-size:22px;color:#a5a5b8;white-space:nowrap;overflow:hidden}
#hint span{display:inline-block;margin-right:40px}
#hint b{display:inline-block;min-width:44px;padding:2px 10px;margin-right:10px;border-radius:8px;background:#23232e;color:#fff;text-align:center;font-size:20px}

/* Ergebnis-Ansicht */
#ov{position:absolute;left:0;top:0;width:1920px;height:1080px;background:rgba(0,0,0,.82);display:none;z-index:50}
#ov.show{display:block}
#ovc{position:absolute;left:150px;right:150px;top:70px;bottom:70px;background:#111118;border-top:8px solid #e10600;border-radius:28px;padding:34px 48px}
.oh{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;margin-bottom:16px}
.oh .t{-webkit-flex:1;flex:1}
.oh .t span{font-size:22px;color:#a5a5b8}
.oh .t b{display:block;font-size:44px;font-weight:900;font-style:italic;text-transform:uppercase}
.oh .map{width:160px;height:96px}
.osegs{margin-bottom:20px}
.seg{display:inline-block;font-size:24px;font-weight:800;font-style:italic;text-transform:uppercase;padding:13px 32px;margin-right:12px;border-radius:40px;background:#1d1d27}
.seg.on{background:#e10600;color:#fff}
.seg.foc{background:#fff;color:#0b0b10}
</style>
</head>

  TX[sid(s)]=x;line.style.transform=line.style.webkitTransform="translateX("+(-x)+"px)";

function move(d){

    if(RAIL[RI]!=="reload")showPage(RAIL[RI]);paint();return}
  var L=shelves(),s=curShelf();if(!s)return;var r=L.indexOf(s),i=curIdx(s);
  if(d==="l"){if(i>0)setCur(s,i-1);else{Z="rail";RI=RAIL.indexOf(P)}}
  else if(d==="r"){setCur(s,i+1)}
  else if(d==="u"){if(r>0)ROW[P]=sid(L[r-1])}
  else if(d==="d"){if(r<L.length-1)ROW[P]=sid(L[r+1])}
