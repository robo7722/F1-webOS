<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>F1 Hub</title>
<style>
/* Bewusst konservatives CSS: kein grid, kein flex-gap, kein inset – läuft ab Chromium 53 (webOS 4). */
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#0b0b0f}
body{color:#f2f2f5;font:26px/1.35 "LG Smart UI","Museo Sans",Roboto,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}
:root{--bg:#0b0b0f;--card:#16161d;--card2:#1e1e28;--tx:#f2f2f5;--mut:#a3a3b5;--ln:#2a2a36;--f1:#e10600;--f2:#2d7dff}
#app{position:absolute;left:0;top:0;width:1920px;height:1080px;-webkit-transform-origin:0 0;transform-origin:0 0;background:var(--bg)}

/* Kopfzeile – Rand 80px/44px als Overscan-Sicherheitszone */
#top{position:absolute;left:80px;right:80px;top:44px;height:92px;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center}
#logo{height:52px;width:auto;display:block;margin-right:56px}
#tabs{display:-webkit-flex;display:flex}
.tab,.chip,.ch2,.seg{border:0;background:var(--card2);color:var(--tx);font:inherit;font-weight:800;font-style:italic;text-transform:uppercase;letter-spacing:.5px;-webkit-clip-path:polygon(14px 0,100% 0,calc(100% - 14px) 100%,0 100%);clip-path:polygon(14px 0,100% 0,calc(100% - 14px) 100%,0 100%);cursor:pointer}
.tab{font-size:28px;padding:16px 46px;margin-right:12px}
.tab.on,.chip.on,.ch2.on,.seg.on{background:var(--f1);color:#fff}
.tab.foc,.chip.foc,.ch2.foc,.seg.foc{background:#fff;color:#0b0b0f}
#clock{margin-left:auto;text-align:right;line-height:1.1}
#clock b{display:block;font-size:48px;font-weight:700;font-variant-numeric:tabular-nums}
#clock span{font-size:22px;color:var(--mut)}

#body{position:absolute;left:80px;right:80px;top:156px;bottom:44px;display:-webkit-flex;display:flex}

/* Linke Spalte: nächster Termin */
#side{width:540px;-webkit-flex:none;flex:none;margin-right:36px;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column}
.hero{position:relative;overflow:hidden;border-radius:24px;background:#1b1b24;color:#fff;padding:30px 32px 28px}
.hero .bg{position:absolute;left:-12px;top:-12px;right:-12px;bottom:-12px;background-size:cover;background-position:center;-webkit-filter:blur(4px) saturate(1.1);filter:blur(4px) saturate(1.1)}
.hero .ov{position:absolute;left:0;top:0;right:0;bottom:0;background:linear-gradient(180deg,rgba(0,0,0,.3),rgba(0,0,0,.72))}
.hero .hc{position:relative;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.hero small{display:block;font-size:20px;letter-spacing:2px;text-transform:uppercase;opacity:.9}
.hero .g{font-size:46px;font-weight:900;font-style:italic;text-transform:uppercase;line-height:1.05;margin:10px 0 6px}
.hero .n{font-size:32px;font-weight:700}
.hero .d{font-size:26px;opacity:.92;margin-top:4px}
.cd{display:-webkit-flex;display:flex;margin-top:22px}
.cd div{-webkit-flex:1;flex:1;background:rgba(0,0,0,.38);border-radius:14px;padding:10px 0 8px;text-align:center;margin-right:12px}
.cd div:last-child{margin-right:0}
.cd b{display:block;font-size:54px;line-height:1.05;font-variant-numeric:tabular-nums}
.cd span{font-size:17px;text-transform:uppercase;letter-spacing:1px;opacity:.85}
.hwx{position:relative;margin-top:22px;font-size:23px;line-height:1.45}
.hwx b{display:inline-block;min-width:110px;color:#fff}
.hwx .m{color:rgba(255,255,255,.75)}
#upnext{margin-top:24px}
#upnext h4{margin:0 0 8px;font-size:20px;letter-spacing:2px;text-transform:uppercase;color:var(--mut);font-weight:600}
.un{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;padding:9px 0;border-top:1px solid var(--ln);font-size:23px}
.un .s{-webkit-flex:1;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-left:12px}
.un .t{color:var(--mut);font-variant-numeric:tabular-nums;white-space:nowrap}
#sfoot{margin-top:auto}
#st{font-size:16px;color:var(--mut);line-height:1.4;margin-top:12px}
.btn{display:inline-block;border:0;border-radius:14px;background:var(--card2);color:var(--tx);font:inherit;font-size:23px;font-weight:700;padding:14px 26px;cursor:pointer}
.btn.pri{background:var(--f1);color:#fff}

/* Rechte Spalte: Tab-Inhalt (wird per Fokus gescrollt) */
#main{position:relative;-webkit-flex:1;flex:1;overflow:hidden;scroll-behavior:smooth}
.pnl{padding:14px 16px 40px}
.bar{display:-webkit-flex;display:flex;margin-bottom:24px}
.chip,.ch2{font-size:24px;padding:13px 34px;margin-right:12px}
.wrap2:after,.wrap3:after,.wrap4:after{content:"";display:table;clear:both}
.c2,.c3,.c4{float:left;margin-bottom:28px}
.c2{width:calc(50% - 14px);margin-right:28px}.c2:nth-child(2n){margin-right:0}.c2:nth-child(2n+1){clear:left}
.c3{width:calc(33.333% - 19px);margin-right:28px}.c3:nth-child(3n){margin-right:0}.c3:nth-child(3n+1){clear:left}
.c4{width:calc(25% - 21px);margin-right:28px}.c4:nth-child(4n){margin-right:0}.c4:nth-child(4n+1){clear:left}

.card{position:relative;background:var(--card);border:1px solid var(--ln);border-left:6px solid var(--f1);border-radius:20px;overflow:hidden;-webkit-transition:-webkit-transform .12s,box-shadow .12s;transition:transform .12s,box-shadow .12s}
.card.foc,.btn.foc{box-shadow:0 0 0 5px #fff,0 0 34px 10px rgba(225,6,0,.6);-webkit-transform:scale(1.025);transform:scale(1.025);z-index:2}
.btn.foc{background:#fff;color:#0b0b0f}
.gh{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;padding:18px 22px 10px}
.flag{width:54px;height:36px;border-radius:5px;-webkit-flex:none;flex:none;margin-right:18px;background:#333;object-fit:cover}
.gt{-webkit-flex:1;flex:1;min-width:0}
.gt b{display:block;font-size:30px;font-weight:900;font-style:italic;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gt span{font-size:21px;color:var(--mut)}
.trk{width:104px;height:62px;-webkit-flex:none;flex:none}
.trk path{fill:none;stroke:var(--tx);stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke;opacity:.9}
.wx{padding:0 22px 12px;font-size:20px;color:var(--mut);line-height:1.45}
.wx b{color:var(--tx)}
.dh{padding:6px 22px;font-size:18px;color:var(--mut);background:var(--card2);text-transform:uppercase;letter-spacing:1px}
.row{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;padding:10px 22px;border-top:1px solid var(--ln)}
.row.past{opacity:.42}
.tag{font-size:17px;font-weight:800;padding:3px 9px;border-radius:7px;color:#fff;min-width:46px;text-align:center;margin-right:16px}
.tag.F1{background:var(--f1)}.tag.F2{background:var(--f2)}
.row .s{-webkit-flex:1;flex:1;font-size:24px;font-weight:700}
.row .tm{text-align:right;font-variant-numeric:tabular-nums;font-size:24px;font-weight:700}
.row .tm span{display:block;font-size:16px;font-weight:400;color:var(--mut)}
.empty{color:var(--mut);padding:40px 0;text-align:center}

.ny{margin:22px 0 18px}
.ny .chk{height:14px;background:repeating-linear-gradient(90deg,#111 0,#111 14px,#fff 14px,#fff 28px);border-radius:2px}
.ny h2{margin:14px 0 2px;font-size:36px;font-style:italic;font-weight:900;text-transform:uppercase;letter-spacing:1px}
.ny h2 b{color:var(--f1)}
.ny small{color:var(--mut);font-size:20px}
.yt{padding:16px 18px;min-height:150px}
.yt .flag{width:48px;height:32px;margin:0 0 10px}
.yt b{display:block;font-size:23px;line-height:1.2}
.yt i{display:block;font-style:normal;color:var(--mut);font-size:19px;margin-top:4px}
.yt .trk{position:absolute;right:12px;top:12px;width:78px;height:46px}
.spr{display:inline-block;font-style:normal;font-size:14px;font-weight:800;border:2px solid var(--f1);color:var(--f1);padding:0 6px;border-radius:4px;margin-top:6px;text-transform:uppercase}

/* WM-Tabelle in zwei Spalten */
.sub{color:var(--mut);font-size:21px;margin-bottom:16px}
.tcol{float:left;width:calc(50% - 14px);margin-right:28px;background:var(--card);border:1px solid var(--ln);border-radius:20px;overflow:hidden}
.tcol:last-child{margin-right:0}
.tr{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;height:56px;padding:0 20px;border-top:1px solid var(--ln);border-left:6px solid transparent;font-size:23px}
.tr:first-child{border-top:0}
.tr .p{width:46px;font-weight:800;color:var(--mut)}
.tr .n{-webkit-flex:1;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.tr .n em{font-style:normal;font-weight:400;color:var(--mut);font-size:19px;margin-left:10px}
.tr .v{font-variant-numeric:tabular-nums;font-weight:800;text-align:right;min-width:70px}
.tr .v.w{min-width:150px;font-weight:600}
.tr .v small{font-size:15px;color:var(--mut);font-weight:400;margin-left:4px}
.fl{color:#c77dff}

/* Ergebnisse & News */
.rc{padding:18px 20px;min-height:200px}
.rc small{display:block;color:var(--mut);font-size:18px;text-transform:uppercase;letter-spacing:1px}
.rc b.nm{display:block;font-size:26px;font-weight:900;font-style:italic;text-transform:uppercase;margin:4px 110px 12px 0;line-height:1.15}
.rc .trk{position:absolute;right:16px;top:16px}
.rc i{display:block;font-style:normal;font-size:16px;text-transform:uppercase;letter-spacing:1px;color:var(--mut)}
.rc .w{font-size:22px;font-weight:700}
.rc .w em{font-style:normal;font-weight:400;color:var(--mut);font-size:18px}
.nc{padding:20px 22px;height:236px}
.nc small{display:block;color:var(--mut);font-size:18px;margin-bottom:10px}
.nc small .tag{font-size:14px;min-width:38px;margin-right:8px}
.nc h3{margin:0;font-size:25px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.foot{clear:both;color:var(--mut);font-size:18px;text-align:center;padding-top:10px}

/* Overlay-Karte */
#ov{position:absolute;left:0;top:0;width:1920px;height:1080px;background:rgba(0,0,0,.78);display:none;z-index:50}
#ov.show{display:block}
#ovc{position:absolute;left:180px;right:180px;top:90px;bottom:90px;background:#121219;border:1px solid var(--ln);border-top:8px solid var(--f1);border-radius:28px;padding:40px 48px;overflow:hidden}
.oh{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;margin-bottom:26px}
.oh .flag{width:84px;height:56px;margin-right:26px}
.oh .gt b{font-size:46px}
.oh .gt span{font-size:24px}
.oh .trk{width:210px;height:126px}
.osegs{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;margin-bottom:22px}
.osegs .hint{margin-left:auto;color:var(--mut);font-size:20px}
#ovc .tr{height:49px;font-size:22px}
#ovc .oh .trk{width:170px;height:100px}
#ovc .oh.sm{margin-bottom:18px}
.seg{font-size:24px;padding:13px 34px;margin-right:12px}
.ofoot{position:absolute;left:48px;right:48px;bottom:34px;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center}
.ofoot .hint{margin-left:auto;color:var(--mut);font-size:20px}
.ofoot .btn{margin-right:18px}
.ogp{float:left;width:calc(50% - 16px);margin-right:32px}
.ogp:nth-child(2n){margin-right:0}
.on h2{font-size:44px;line-height:1.25;margin:10px 0 24px}
.on p{font-size:26px;color:var(--mut)}
</style>
</head>
